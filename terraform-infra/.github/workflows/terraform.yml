name: Terraform IaC Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'environments/prod/**'
  push:
    branches: [ "main" ]
    paths:
      - 'environments/prod/**'

permissions:
  id-token: write # AWS OIDC authentication සඳහා අනිවාර්යයි
  contents: read
  pull-requests: write # PR එකට comment එකක් දැමීමට අවසර ලබා දීම

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: "environments/prod"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  terraform:
    name: Terraform Automation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # AWS credentials configure කිරීම OIDC හරහා (No permanent keys)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: false

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Pull Request එකකදී පමණක් Plan එක execute කර output එක save කිරීම
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -out=tfplan \
          && terraform show -no-color tfplan > plan_output.txt
        continue-on-error: false

      # PR එකට bot comment එකක් මඟින් Plan output එක post කිරීම
      - name: Update Pull Request with Plan Output
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planText = 'No changes detected.';
            try {
              planText = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            } catch (err) {
              planText = 'Error reading plan file.';
            }

            // GitHub comment character limit එක 65536 බැවින් truncate කිරීම
            const maxLen = 60000;
            const outputBody = planText.length > maxLen 
              ? `${planText.substring(0, maxLen)}\n... (Output truncated due to size)` 
              : planText;

            const body = `### Terraform Plan Result
            #### Format Check: \`${{ steps.fmt.outcome }}\`
            #### Initialization: \`${{ steps.init.outcome }}\`
            #### Validation: \`${{ steps.validate.outcome }}\`

            <details>
            <summary>Show Plan Summary</summary>

            \`\`\`hcl
            ${outputBody}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # Main branch එකට push/merge වූ විට පමණක් Apply run වීම
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
